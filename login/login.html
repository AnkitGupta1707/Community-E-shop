<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register | Community E-Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-green-50 px-4 py-8 text-slate-800">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <a href="../home/home.html" class="mb-6 block text-center">
      <span class="text-2xl font-bold text-green-700">🌱 Community E-Shop</span>
      <span class="mt-1 block text-sm text-slate-500">Buy together. Save together. Grow together.</span>
    </a>

    <!-- Mode toggle -->
    <div class="mb-6 grid grid-cols-2 rounded-lg bg-slate-100 p-1 text-sm font-medium">
      <button id="tab-login" type="button" class="rounded-md bg-white py-2 text-green-700 shadow">Login</button>
      <button id="tab-register" type="button" class="rounded-md py-2 text-slate-500 hover:text-slate-700">Register</button>
    </div>

    <form id="auth-form" class="space-y-4">
      <div id="name-wrap" class="hidden">
        <label class="mb-1 block text-sm font-medium text-slate-700">Full name</label>
        <input id="name" type="text" placeholder="Jane Smith" class="field" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" class="field" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" required minlength="6" placeholder="At least 6 characters" class="field" />
      </div>

      <div id="register-extra" class="hidden space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Confirm password</label>
          <input id="confirm" type="password" class="field" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">I am a</label>
          <select id="role" class="field">
            <option value="member">Community member</option>
            <option value="organiser">Organiser</option>
          </select>
        </div>
      </div>

      <p id="error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600"></p>

      <button id="submit" type="submit" class="w-full rounded-lg bg-green-700 py-2.5 text-sm font-semibold text-white transition hover:bg-green-800">Log in</button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      <span id="switch-text">New to Community E-Shop?</span>
      <button id="switch-btn" type="button" class="font-medium text-green-700 hover:underline">Register</button>
    </p>

    <div class="mt-4 border-t pt-4 text-center">
      <a href="../home/home.html" class="text-xs text-slate-400 hover:text-slate-600">← Back to home</a>
    </div>
  </div>

  <style>
    .field { width: 100%; border-radius: 0.5rem; border: 1px solid #cbd5e1; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    .field:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.2); }
  </style>

  <script>
    let mode = "login";
    const $ = (id) => document.getElementById(id);

    function render() {
      const reg = mode === "register";
      $("name-wrap").classList.toggle("hidden", !reg);
      $("register-extra").classList.toggle("hidden", !reg);
      $("name").required = reg;
      $("confirm").required = reg;
      $("submit").textContent = reg ? "Create account" : "Log in";
      $("switch-text").textContent = reg ? "Already have an account?" : "New to Community E-Shop?";
      $("switch-btn").textContent = reg ? "Log in" : "Register";
      $("tab-login").className = "rounded-md py-2 " + (!reg ? "bg-white text-green-700 shadow" : "text-slate-500 hover:text-slate-700");
      $("tab-register").className = "rounded-md py-2 " + (reg ? "bg-white text-green-700 shadow" : "text-slate-500 hover:text-slate-700");
      $("error").classList.add("hidden");
    }

    $("tab-login").onclick = () => { mode = "login"; render(); };
    $("tab-register").onclick = () => { mode = "register"; render(); };
    $("switch-btn").onclick = () => { mode = mode === "login" ? "register" : "login"; render(); };

    $("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (mode === "register" && $("password").value !== $("confirm").value) {
        $("error").textContent = "Passwords do not match.";
        $("error").classList.remove("hidden");
        return;
      }

      const email = $("email").value.trim().toLowerCase();
      let role = "member";
      if (mode === "register") {
        role = $("role").value;
      } else {
        if (email.includes("organiser") || email.includes("admin")) {
          role = "organiser";
        }
      }

      localStorage.setItem("currentUser", JSON.stringify({
        email: email,
        name: $("name").value || email.split("@")[0],
        role: role
      }));

      if (role === "organiser") {
        window.location.href = "../organiser dashboard/organiserdashboard.html";
      } else {
        window.location.href = "../members dashboard/memberdashboard.html";
      }
    });

    render();
  </script>
</body>
</html>
